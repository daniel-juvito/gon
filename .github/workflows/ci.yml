name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: true

      - name: Build
        run: go build -o gon ./cmd/gon

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Format (.gon files)
        # testdata/diagnostic-protocol/positions/ is excluded on purpose: those
        # fixtures pin exact line/column positions (for example a `;` that
        # `gon fmt` would split across lines), so they must stay as written.
        run: |
          fail=0
          for f in $(find . -name '*.gon' -not -path './testdata/diagnostic-protocol/positions/*' | sort); do
            tmp=$(mktemp --suffix=.gon)
            cp "$f" "$tmp"
            ./gon fmt "$tmp" > /dev/null
            if ! cmp -s "$f" "$tmp"; then
              echo "needs gon fmt: $f"
              fail=1
            fi
            rm -f "$tmp"
          done
          exit $fail

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -coverprofile=coverage.out

      - name: Coverage summary
        run: |
          echo "### Test coverage" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"

  # Portability, informational: the same vet and test on the other operating
  # systems, so what the Linux gate cannot show (paths, symlinks, line endings,
  # the null device, go env) is measured. Linux stays the gate (build-and-test):
  # its format and coverage steps use GNU shell tools and stay there. No
  # continue-on-error: a failure is visible and is classified, not hidden. This
  # job is not a required check.
  test-os:
    name: test-os (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

  # Gon's own sources (dogfood, D2/D3): the committed .go next to every .gon
  # must be exactly what a PINNED gon release transpiles it to. The checker
  # built from this commit is not used, so a broken checker cannot pass itself.
  gon-sources:
    runs-on: ubuntu-latest
    env:
      GON_VERSION: v1.25.0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'

      - name: Install the pinned gon
        run: |
          go install "github.com/daniel-juvito/gon/cmd/gon@${GON_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: gon version
        run: gon version

      - name: .go files match their .gon sources
        run: scripts/check-gon-sources.sh

      - name: Gon's own sources satisfy their contracts
        # A warning does not fail `gon check` (exit 0), so the output is read:
        # any diagnostic, GW006 included, is a failure of this gate.
        run: |
          out=$(gon check ./... 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          if [ "$out" != "ok" ]; then
            echo "gon check ./... must print exactly ok"
            exit 1
          fi

